<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Prism Parcel</title>
<style>
:root{
  --bg:#101528; --panel:#1a2140; --panel2:#141a33; --ink:#eef1ff; --dim:#9aa4cc;
  --accent:#7fe7c4; --danger:#ff6f6f; --focus:#ffd76f;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px); --sar: env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}
button{font:inherit;color:inherit;background:#2a3464;border:1px solid #3d4a8a;border-radius:10px;
  padding:.6rem 1rem;cursor:pointer;min-height:44px;min-width:44px}
button:hover{background:#35418a}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#0a1410;font-weight:700}
button.primary:hover{filter:brightness(1.1)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{line-height:1.2;margin:.2em 0}
p,li{max-width:70ch}
[hidden]{display:none !important}

/* ---------- layout shell ---------- */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1rem;padding:calc(1rem + var(--sat)) calc(1rem + var(--sar)) calc(1rem + var(--sab)) calc(1rem + var(--sal));
  text-align:center;overflow:auto}
.panel{background:var(--panel);border:1px solid #2c3766;border-radius:16px;padding:1.2rem 1.4rem;
  box-shadow:0 8px 30px rgba(0,0,0,.35)}
.menu{display:flex;flex-direction:column;gap:.6rem;min-width:min(320px,86vw)}
.menu button{width:100%}
.brand{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:.06em;margin:0;
  background:linear-gradient(90deg,#7fe7c4,#6fd3ff,#c99fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--dim);margin:0 0 1rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.small{font-size:.85rem;color:var(--dim)}

/* ---------- game screen ---------- */
#game-screen{padding:0;justify-content:flex-start;align-items:stretch;flex-direction:row}
#rail-left,#rail-right{width:230px;flex:0 0 auto;display:flex;flex-direction:column;gap:.8rem;
  padding:calc(.8rem + var(--sat)) .8rem calc(.8rem + var(--sab)) .8rem;overflow:auto}
#rail-left{padding-left:calc(.8rem + var(--sal))}
#rail-right{padding-right:calc(.8rem + var(--sar))}
#playfield{flex:1;position:relative;min-width:0;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud-top{position:absolute;top:calc(.5rem + var(--sat));left:50%;transform:translateX(-50%);
  display:flex;gap:1rem;align-items:center;background:rgba(16,21,40,.72);border-radius:12px;
  padding:.3rem .9rem;pointer-events:none;white-space:nowrap}
#hud-top .score{font-size:1.3rem;font-weight:700}
#hud-actions{position:absolute;right:calc(.5rem + var(--sar));top:calc(.5rem + var(--sat));display:flex;gap:.4rem}
#hud-actions button{padding:.4rem .7rem}
#offer-tray{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(.6rem + var(--sab));display:flex;gap:.8rem;pointer-events:none}
#offer-tray .offer{pointer-events:auto;background:rgba(16,21,40,.78);border:2px solid #3d4a8a;
  border-radius:12px;padding:.4rem .8rem;font-size:.8rem;color:var(--dim)}
#offer-tray .offer.selected{border-color:var(--accent);color:var(--ink)}
#offer-tray .offer.used{opacity:.35}
.stat{display:flex;justify-content:space-between;gap:.6rem;font-size:.92rem}
.stat b{font-variant-numeric:tabular-nums}
.card{background:var(--panel2);border:1px solid #2c3766;border-radius:12px;padding:.7rem .9rem;text-align:left}
.card h3{margin-top:0;font-size:.95rem;color:var(--accent)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,10,22,.66);display:flex;align-items:center;
  justify-content:center;z-index:40;padding:1rem}
.overlay .panel{max-width:min(560px,94vw);max-height:88dvh;overflow:auto;text-align:left;width:100%}
.overlay .panel h2{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;font-size:.95rem}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.settings-grid{display:grid;gap:.8rem}
.settings-grid label{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.settings-grid input[type=range]{flex:1;max-width:200px}
.settings-grid select{background:#2a3464;color:var(--ink);border:1px solid #3d4a8a;border-radius:8px;padding:.35rem}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:.5rem;max-width:560px}
.stage-grid button{padding:.5rem .2rem;display:flex;flex-direction:column;gap:.1rem;font-size:.85rem}
.stage-grid button .stars{color:var(--focus);font-size:.7rem}
.stage-grid button.locked{opacity:.35}
.friends-list{display:flex;flex-direction:column;gap:.4rem;text-align:left}

/* ---------- accessibility helpers ---------- */
.visually-hidden{position:absolute !important;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#live{position:absolute;left:-9999px}
.skip-link{position:absolute;left:-9999px;top:0}
.skip-link:focus{left:1rem;top:1rem;z-index:99;background:var(--panel);padding:.5rem 1rem;border-radius:8px}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  #rail-left{display:none}
  #rail-left.open{display:flex;position:fixed;z-index:30;left:0;top:0;bottom:0;background:var(--panel);
    padding-top:calc(3.5rem + var(--sat));box-shadow:4px 0 20px rgba(0,0,0,.5)}
  #rail-right{display:none}
  #rail-right.open{display:flex;position:fixed;z-index:30;right:0;top:0;bottom:0;background:var(--panel);
    padding-top:calc(3.5rem + var(--sat));box-shadow:-4px 0 20px rgba(0,0,0,.5)}
}
@media (max-width:640px){
  #hud-top{font-size:.85rem;gap:.6rem;left:calc(.4rem + var(--sal));transform:none}
  #hud-objective{display:none}
  #offer-tray{gap:.4rem}
  .screen{padding-left:calc(.6rem + var(--sal));padding-right:calc(.6rem + var(--sar))}
}
@media (orientation:landscape) and (max-height:520px){
  #hud-top{top:calc(.2rem + var(--sat))}
  #offer-tray{bottom:calc(.2rem + var(--sab))}
  button{min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
body.high-contrast{--bg:#000;--panel:#0a0a0a;--panel2:#111;--ink:#fff;--dim:#ddd;
  --accent:#00ffcc;--focus:#ffff00}
body.high-contrast button{border-width:2px}
body.large-text{font-size:120%}
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.min.js" } }
</script>
</head>
<body>
<a class="skip-link" href="#main-region">Skip to game</a>
<div id="app">

  <!-- Title / home -->
  <section id="title-screen" class="screen" aria-labelledby="title-heading">
    <h1 id="title-heading" class="brand">Prism Parcel</h1>
    <p class="tagline">A luminous tabletop of frosted blocks. Fill rows and columns to clear them together.</p>
    <nav class="menu" aria-label="Main menu">
      <button id="btn-play" class="primary">Play</button>
      <button id="btn-daily">Daily Challenge</button>
      <button id="btn-journey">Journey</button>
      <button id="btn-practice">Practice</button>
      <button id="btn-learn">Learn to Play</button>
      <button id="btn-help">Help &amp; Rules</button>
      <button id="btn-settings">Settings</button>
    </nav>
    <p class="small" id="title-progress"></p>
    <p class="small" id="title-clock"></p>
  </section>

  <!-- Mode / journey setup -->
  <section id="setup-screen" class="screen" hidden aria-labelledby="setup-heading">
    <div class="panel" style="width:min(620px,94vw);text-align:left">
      <h2 id="setup-heading">Mode</h2>
      <div id="setup-body"></div>
      <div class="row" style="margin-top:1rem">
        <button id="setup-start" class="primary">Start</button>
        <button id="setup-back" class="ghost">Back</button>
      </div>
    </div>
  </section>

  <!-- Game -->
  <section id="game-screen" class="screen" hidden aria-label="Game board" tabindex="-1">
    <aside id="rail-left" aria-label="Objective and progress"></aside>
    <main id="playfield">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div id="hud-top" role="status" aria-label="Score and state">
        <span class="score" id="hud-score">0</span>
        <span id="hud-objective"></span>
        <span id="hud-combo"></span>
      </div>
      <div id="hud-actions">
        <button id="btn-drawer" aria-label="Open info panel">☰</button>
        <button id="btn-hint" title="Hint (H)">Hint</button>
        <button id="btn-undo" title="Undo (U)">Undo</button>
        <button id="btn-pause" title="Pause (Esc)">Pause</button>
      </div>
      <div id="offer-tray" role="group" aria-label="Offered pieces"></div>
      <div id="board-mirror" class="visually-hidden" role="grid" aria-label="Board cells"></div>
    </main>
    <aside id="rail-right" aria-label="Status and actions"></aside>
  </section>

  <!-- Results -->
  <section id="results-screen" class="screen" hidden aria-labelledby="results-heading">
    <div class="panel" style="width:min(560px,94vw);text-align:left">
      <h2 id="results-heading">Round Over</h2>
      <p id="results-sub" class="small"></p>
      <dl class="kv" id="results-breakdown"></dl>
      <div id="results-achievements"></div>
      <div id="results-compare" class="small"></div>
      <div class="row" style="margin-top:1rem">
        <button id="btn-retry" class="primary">Retry</button>
        <button id="btn-next">Next</button>
        <button id="btn-results-home" class="ghost">Home</button>
      </div>
    </div>
  </section>
</div>

<!-- Pause overlay -->
<div id="pause-overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="pause-heading">
  <div class="panel">
    <h2 id="pause-heading">Paused</h2>
    <div class="menu">
      <button id="btn-resume" class="primary">Resume</button>
      <button id="btn-pause-settings">Settings</button>
      <button id="btn-pause-help">Help</button>
      <button id="btn-quit" class="ghost">Leave Round</button>
    </div>
  </div>
</div>

<!-- Settings overlay -->
<div id="settings-overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="settings-heading">
  <div class="panel">
    <h2 id="settings-heading">Settings</h2>
    <div class="settings-grid" id="settings-body"></div>
    <div class="row" style="margin-top:1rem">
      <button id="btn-settings-close" class="primary">Done</button>
    </div>
  </div>
</div>

<!-- Help overlay -->
<div id="help-overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="help-heading">
  <div class="panel">
    <h2 id="help-heading">How to Play</h2>
    <div id="help-body"></div>
    <div class="row" style="margin-top:1rem">
      <button id="btn-help-close" class="primary">Close</button>
    </div>
  </div>
</div>

<div id="live" aria-live="polite" role="status"></div>
<div id="live-assertive" aria-live="assertive" role="alert" class="visually-hidden"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
